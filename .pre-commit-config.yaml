# Usa las herramientas instaladas en el entorno (`make install`), mismas versiones que la CI.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: system
        types: [python]
        pass_filenames: false
