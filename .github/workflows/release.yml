name: release

# Publica la imagen en GHCR al crear un tag de versión (v0.3.0 → :0.3.0, :0.3 y :latest).
# Usa el GITHUB_TOKEN de la ejecución: no hace falta ningún token personal.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: La versión del tag coincide con la del paquete y la de action.yml
        run: |
          paquete="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/prolijito/__init__.py)"
          test "v$paquete" = "$GITHUB_REF_NAME" || {
            echo "::error::El tag $GITHUB_REF_NAME no coincide con __version__ = $paquete"
            exit 1
          }
          grep -q "^  image: docker://ghcr.io/${GITHUB_REPOSITORY}:${paquete}$" action.yml || {
            echo "::error::action.yml no apunta a la imagen ${paquete}"
            exit 1
          }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Antes de publicar: la imagen tiene que cumplir la definición de terminado.
      - name: Build de prueba (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prolijito:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo
        run: scripts/smoke-test.sh prolijito:release

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publicar (amd64 y arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Con la imagen ya publicada: la imagen descargada y la Action tal como la usan otros repos.
  verificar:
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prueba de humo de la imagen publicada
        run: scripts/smoke-test.sh "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
      - name: La Action con la imagen publicada, un PDF que cumple
        uses: ./
        with:
          profile: unlp-tp2
          path: tests/fixtures/pdf/cumple.pdf
