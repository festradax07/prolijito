[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prolijito"
dynamic = ["version"]
description = "Valida el formato de informes contra una norma, sin tocar el contenido."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.scripts]
prolijito = "prolijito.cli:run"

[tool.setuptools.dynamic]
version = { attr = "prolijito.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prolijito = ["**/*.json", "**/*.yaml"]

# ---------- ruff ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # orden de imports
    "N",        # naming
    "UP",       # sintaxis moderna
    "B",        # bugbear
    "C4",       # comprehensions
    "C90",      # complejidad ciclomática
    "SIM",      # simplificaciones
    "RET",      # returns
    "ARG",      # argumentos sin usar
    "PTH",      # pathlib en vez de os.path
    "PL",       # pylint
    "PT",       # estilo pytest
    "S",        # seguridad (bandit)
    "TID",      # imports: absolutos, prohibidos
    "ERA",      # código comentado
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR2004", "ARG"]  # los dobles de prueba ignoran argumentos

# ---------- mypy ----------

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

# ---------- import-linter ----------

[tool.importlinter]
root_package = "prolijito"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas de la arquitectura hexagonal (ADR 0005)"
type = "layers"
layers = [
    "prolijito.cli",
    "prolijito.adapters | prolijito.report",
    "prolijito.application",
    "prolijito.validate",
    "prolijito.domain",
]

[[tool.importlinter.contracts]]
name = "El núcleo no depende de formatos ni de bibliotecas de I/O"
type = "forbidden"
source_modules = ["prolijito.domain", "prolijito.validate", "prolijito.application"]
forbidden_modules = ["yaml", "jsonschema"]

# ---------- pytest / coverage ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=prolijito --cov-branch --cov-report=term-missing"
markers = [
    "system: necesita dependencias de sistema (poppler, fuentes); corre dentro de la imagen",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
